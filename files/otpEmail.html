<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP for Password Reset</title>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f1f6f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background-color: #fff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 90%;
            max-width: 500px;
            animation: fadeIn 1s ease-out;
        }

        h2 {
            color: #007B7F;
            font-weight: 700;
            margin-bottom: 20px;
        }

        h1 {
            color: #FF6F61;
            font-size: 36px;
            font-weight: 700;
            margin: 20px 0;
        }

        p {
            color: #555;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .btn {
            display: inline-block;
            background-color: #FF6F61;
            color: #fff;
            padding: 12px 25px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            transition: background-color 0.3s ease;
            animation: fadeIn 1s ease-out;
        }

        .btn:hover {
            background-color: #FF5a4c;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>Hello ${firstName},</h2>
            <p>We received a request to reset your password. Use the OTP below to proceed:</p>
            <h1>${otp}</h1>
            <p>This OTP is valid for 5 minutes. If you did not request a password reset, please ignore this email.</p>
            <p>For support, contact us at <a href="mailto:support@kisanwale.in">support@kisanwale.in</a>.</p>
        </div>
    </div>
</body>
</html>
